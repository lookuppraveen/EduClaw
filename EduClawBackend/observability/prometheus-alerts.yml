groups:
  - name: educlaw-backend
    rules:
      - alert: EduClawBackendHighErrorRate
        expr: |
          sum(rate(educlaw_http_requests_total{status_class=~"5.."}[5m]))
          /
          clamp_min(sum(rate(educlaw_http_requests_total[5m])), 0.001)
          > 0.02
        for: 10m
        labels:
          severity: page
          service: educlaw-backend
        annotations:
          summary: EduClaw backend 5xx rate is above 2 percent
          description: The backend has returned elevated 5xx responses for more than 10 minutes.

      - alert: EduClawBackendHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(educlaw_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2.5
        for: 10m
        labels:
          severity: page
          service: educlaw-backend
        annotations:
          summary: EduClaw backend p95 latency is above target
          description: The backend p95 request latency is above 2.5 seconds for more than 10 minutes.

      - alert: EduClawBackendRateLimitedTraffic
        expr: |
          sum(rate(educlaw_http_requests_total{status_class="4xx",route=~".*"}[5m])) > 5
        for: 15m
        labels:
          severity: ticket
          service: educlaw-backend
        annotations:
          summary: EduClaw backend is returning sustained 4xx traffic
          description: Sustained client errors may indicate auth, consent, validation, or rate-limit friction.
